name: Launcher quality

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"
  pull_request:
    paths:
      - ".github/workflows/launcher-quality.yml"
      - ".github/workflows/pf001-release-build.yml"
      - ".github/workflows/pf001-native-certification.yml"
      - ".github/workflows/pf001-release.yml"
      - ".github/workflows/pf001-release-qualification.yml"
      - ".golangci.yml"
      - "go.mod"
      - "go.sum"
      - "apps/launcher/**"
      - "contracts/**"
      - "packaging/**"
      - "tools/**"
  push:
    branches:
      - main
      - "codex/**"
    paths:
      - ".github/workflows/launcher-quality.yml"
      - ".github/workflows/pf001-release-build.yml"
      - ".github/workflows/pf001-native-certification.yml"
      - ".github/workflows/pf001-release.yml"
      - ".github/workflows/pf001-release-qualification.yml"
      - ".golangci.yml"
      - "go.mod"
      - "go.sum"
      - "apps/launcher/**"
      - "contracts/**"
      - "packaging/**"
      - "tools/**"

permissions:
  contents: read

concurrency:
  group: launcher-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, architecture, race, and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Install the pinned Go toolchain
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.26.5"
          check-latest: false
          cache: true
          cache-dependency-path: go.mod

      - name: Verify module files
        run: |
          go mod tidy -diff
          go mod verify

      - name: Verify Clean Architecture
        run: go run ./tools/check_launcher_architecture

      - name: Verify closed Linux package contract
        run: go run ./tools/check_linux_package

      - name: Verify closed desktop package contracts
        run: go run ./tools/check_desktop_packages

      - name: Verify immutable release-promotion contract
        run: go run ./tools/check_release_workflow

      - name: Verify executable PF-001 native support matrix
        run: go run ./tools/check_pf001_certification

      - name: Vet launcher and quality tools
        run: go vet ./apps/launcher/... ./tools/...

      - name: Run standalone Staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.7.0 ./apps/launcher/... ./tools/...

      - name: Scan reachable Go vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.4.0 ./apps/launcher/... ./tools/...

      - name: Run strict lint configuration
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2
          args: ./apps/launcher/... ./tools/...
          only-new-issues: false

      - name: Run race tests with randomized ordering
        run: |
          mkdir -p build
          go test -race -shuffle=on -count=1 -covermode=atomic \
            -coverpkg=./apps/launcher/... \
            -coverprofile=build/go-cover.out ./apps/launcher/... ./tools/...

      - name: Enforce launcher coverage policy
        run: |
          go run ./tools/check_go_coverage \
            -profile build/go-cover.out \
            -root . \
            -base origin/main \
            -package 80 \
            -changed 80

      - name: Preserve launcher coverage evidence
        if: ${{ always() && hashFiles('build/go-cover.out') != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: launcher-go-coverage-${{ github.run_id }}
          path: build/go-cover.out
          if-no-files-found: error
          retention-days: 14

  fuzz:
    name: Fuzz (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: installer-state
            package: ./apps/launcher/internal/domain/install
            target: FuzzPF001ReadyRequiresEveryOrderedPhase
          - name: journal-authentication
            package: ./apps/launcher/internal/adapters/filesystem
            target: FuzzPF001InstallJournalRejectsUnauthenticatedBytes
          - name: agent-config-json
            package: ./apps/launcher/internal/domain/agentconfig
            target: FuzzPF001HostNeutralJSONPlanNeverPanics
          - name: artifact-source-range
            package: ./apps/launcher/internal/domain/artifactacquisition
            target: FuzzPF001ArtifactSourceAndRangeValidation
          - name: release-digest
            package: ./apps/launcher/internal/domain/releaseinventory
            target: FuzzParseDigestRoundTrip
          - name: release-oci-reference
            package: ./apps/launcher/internal/domain/releaseinventory
            target: FuzzOCIResourceNeverAcceptsMutableOrMismatchedReference
          - name: release-manifest
            package: ./apps/launcher/internal/domain/releaseinventory
            target: FuzzDecodeManifestV1NeverNormalizesUntrustedInput
          - name: release-anchor
            package: ./apps/launcher/internal/adapters/releaseanchor
            target: FuzzPF001ReleaseAnchorSnapshotStrictDecoder
          - name: release-evidence
            package: ./apps/launcher/internal/adapters/releaseverify
            target: FuzzReleaseEvidenceCanonicalParsers
          - name: release-sigstore-bundle
            package: ./apps/launcher/internal/adapters/releaseverify
            target: FuzzDecodeSigstoreBundle
          - name: resource-observation
            package: ./apps/launcher/internal/domain/resourceinventory
            target: FuzzPF001DockerObservationValidation
          - name: runtime-catalog
            package: ./apps/launcher/internal/domain/runtimecatalog
            target: FuzzDecodeManifestV1
          - name: docker-observation-json
            package: ./apps/launcher/internal/adapters/dockercli
            target: FuzzPF001ManagedResourceJSONDuplicateScanner
          - name: docker-compose-render-json
            package: ./apps/launcher/internal/adapters/dockercli
            target: FuzzPF001RenderedComposeStrictDecoder
          - name: docker-capacity-lease-json
            package: ./apps/launcher/internal/adapters/dockercli
            target: FuzzPF001DockerCapacityLeaseOutputStrictDecoder
          - name: capacity-helper-protocol
            package: ./apps/launcher/internal/capacityhelper
            target: FuzzPF001CapacityHelperStrictParsers
          - name: install-plan
            package: ./apps/launcher/internal/domain/installplan
            target: FuzzDecodeCanonicalPlanV1
          - name: runtime-install-plan
            package: ./apps/launcher/internal/domain/runtimeinstall
            target: FuzzDecodePlanV1
          - name: setup-http-request
            package: ./apps/launcher/internal/adapters/setuphttp
            target: FuzzPF001SetupHTTPStrictRequestParsers
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install the pinned Go toolchain
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.26.5"
          check-latest: false
          cache: true
          cache-dependency-path: go.mod

      - name: Run bounded fuzz target
        env:
          FUZZ_TIME: ${{ github.event_name == 'schedule' && '2m' || '10s' }}
        run: |
          go test "${{ matrix.package }}" \
            -run=^$ \
            -fuzz="${{ matrix.target }}" \
            -fuzztime="$FUZZ_TIME"

  cross-platform:
    name: Unit tests (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner:
          - macos-15-intel
          - macos-15
          - ubuntu-24.04
          - ubuntu-24.04-arm
          - windows-2025
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install the pinned Go toolchain
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.26.5"
          check-latest: false
          cache: true
          cache-dependency-path: go.mod

      - name: Run launcher tests
        run: go test -race -shuffle=on -count=1 ./apps/launcher/...

  mutation-adapter-plan:
    name: Plan native adapter mutation shards
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install the pinned Go toolchain
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.26.5"
          check-latest: false
          cache: true
          cache-dependency-path: go.mod

      - name: Generate non-empty native build shards
        id: plan
        shell: bash
        run: |
          matrix="$(go run ./tools/mutation_targets \
            -root apps/launcher/internal/adapters \
            -emit-github-matrix \
            -max-files-per-shard 8)"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  mutation-changed-packages:
    name: Changed launcher package mutation gate (${{ matrix.name }})
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: commands
            package_pattern: '^github\.com/rickyseezy/AgentMemory/apps/launcher/cmd/'
          - name: application-a-m
            package_pattern: '^github\.com/rickyseezy/AgentMemory/apps/launcher/internal/application/[a-m]'
          - name: application-n-z
            package_pattern: '^github\.com/rickyseezy/AgentMemory/apps/launcher/internal/application/[n-z]'
          - name: domain-a-m
            package_pattern: '^github\.com/rickyseezy/AgentMemory/apps/launcher/internal/domain/[a-m]'
          - name: domain-n-z
            package_pattern: '^github\.com/rickyseezy/AgentMemory/apps/launcher/internal/domain/[n-z]'
          - name: composition
            package_pattern: '^github\.com/rickyseezy/AgentMemory/apps/launcher/internal/(capacityhelper|infrastructure|secretprojector)'
    steps:
      - name: Check out source and mutation base
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Install the pinned Go toolchain
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.26.5"
          check-latest: false
          cache: true
          cache-dependency-path: go.mod

      - name: Enforce changed critical-code mutation score
        shell: bash
        run: |
          # Every branch push is evaluated against the trusted integration
          # branch, not merely the immediately preceding branch commit. This
          # prevents a sequence of small pushes from evading the release gate.
          base="origin/main"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="origin/${{ github.base_ref }}"
          fi
          if ! git rev-parse --verify "$base^{commit}" >/dev/null 2>&1; then
            base="origin/main"
          fi
          mapfile -t targets < <(
            go list ./apps/launcher/... |
              awk -v pattern='${{ matrix.package_pattern }}' '$0 ~ pattern'
          )
          if [ "${#targets[@]}" -eq 0 ]; then
            echo "No launcher packages matched mutation shard ${{ matrix.name }}" >&2
            exit 1
          fi
          # mutago v2.7.7, pinned to the peeled tag commit.
          status=0
          go run github.com/quality-gates/mutago/v2/cmd/mutago@5e268a05d68c37d3b89a56447b4e80f791f824c2 \
            --noop \
            --coverage \
            --per-test \
            --git-diff-lines \
            --git-diff-base "$base" \
            --ignore-msi-with-no-mutations \
            --min-msi 80 \
            --min-covered-msi 80 \
            --exec-timeout 120 \
            --timeout-coefficient 5 \
            --workers 4 \
            --logger-github \
            --logger-summary-json \
            --quiet \
            --no-diffs \
            "${targets[@]}" || status=$?
          if [ -f mutago-summary.json ]; then
            mv mutago-summary.json "mutago-summary-${{ matrix.name }}.json"
          fi
          exit "$status"

      - name: Preserve changed mutation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: changed-mutation-${{ matrix.name }}
          path: mutago-summary-${{ matrix.name }}.json
          if-no-files-found: error
          retention-days: 30

  mutation-changed-adapters:
    name: Changed native adapter mutation gate (${{ matrix.name }})
    if: github.event_name != 'schedule'
    needs: mutation-adapter-plan
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      CGO_ENABLED: ${{ matrix.cgo_enabled }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.mutation-adapter-plan.outputs.matrix) }}
    steps:
      - name: Check out source and mutation base
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Install the pinned Go toolchain
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.26.5"
          check-latest: false
          cache: true
          cache-dependency-path: go.mod

      - name: Enforce changed native adapter mutation score
        shell: bash
        run: |
          base="origin/main"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="origin/${{ github.base_ref }}"
          fi
          if ! git rev-parse --verify "$base^{commit}" >/dev/null 2>&1; then
            base="origin/main"
          fi
          targets=()
          while IFS= read -r target; do
            targets+=("$target")
          done < <(
            go run ./tools/mutation_targets \
              -root apps/launcher/internal/adapters \
              -owner '${{ matrix.owner }}' \
              -shard-index '${{ matrix.shard_index }}' \
              -shard-count '${{ matrix.shard_count }}'
          )
          if [ "${#targets[@]}" -eq 0 ]; then
            echo "Native adapter mutation shard ${{ matrix.name }} is empty" >&2
            exit 1
          fi
          status=0
          go run github.com/quality-gates/mutago/v2/cmd/mutago@5e268a05d68c37d3b89a56447b4e80f791f824c2 \
            --noop \
            --coverage \
            --per-test \
            --git-diff-lines \
            --git-diff-base "$base" \
            --ignore-msi-with-no-mutations \
            --min-msi 80 \
            --min-covered-msi 80 \
            --exec-timeout 120 \
            --timeout-coefficient 5 \
            --workers 4 \
            --logger-github \
            --logger-summary-json \
            --quiet \
            --no-diffs \
            "${targets[@]}" || status=$?
          if [ -f mutago-summary.json ]; then
            mv mutago-summary.json "mutago-summary-adapter-${{ matrix.name }}.json"
          fi
          exit "$status"

      - name: Preserve changed native adapter mutation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: changed-mutation-adapter-${{ matrix.name }}
          path: mutago-summary-adapter-${{ matrix.name }}.json
          if-no-files-found: error
          retention-days: 30

  mutation-nightly-plan:
    name: Plan full native mutation shards
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install the pinned Go toolchain
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.26.5"
          check-latest: false
          cache: true
          cache-dependency-path: go.mod

      - name: Generate non-empty full native build shards
        id: plan
        shell: bash
        run: |
          matrix="$(go run ./tools/mutation_targets \
            -root apps/launcher \
            -emit-github-matrix \
            -max-files-per-shard 8)"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  mutation-nightly:
    name: Full native launcher mutation gate (${{ matrix.name }})
    if: github.event_name == 'schedule'
    needs: mutation-nightly-plan
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    env:
      CGO_ENABLED: ${{ matrix.cgo_enabled }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.mutation-nightly-plan.outputs.matrix) }}
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install the pinned Go toolchain
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.26.5"
          check-latest: false
          cache: true
          cache-dependency-path: go.mod

      - name: Enforce full critical-package mutation score
        shell: bash
        run: |
          targets=()
          while IFS= read -r target; do
            targets+=("$target")
          done < <(
            go run ./tools/mutation_targets \
              -root apps/launcher \
              -owner '${{ matrix.owner }}' \
              -shard-index '${{ matrix.shard_index }}' \
              -shard-count '${{ matrix.shard_count }}'
          )
          if [ "${#targets[@]}" -eq 0 ]; then
            echo "Full native mutation shard ${{ matrix.name }} is empty" >&2
            exit 1
          fi
          # mutago v2.7.7, pinned to the peeled tag commit.
          status=0
          go run github.com/quality-gates/mutago/v2/cmd/mutago@5e268a05d68c37d3b89a56447b4e80f791f824c2 \
            --noop \
            --coverage \
            --per-test \
            --min-msi 80 \
            --min-covered-msi 80 \
            --exec-timeout 120 \
            --timeout-coefficient 5 \
            --workers 4 \
            --logger-github \
            --logger-summary-json \
            --quiet \
            --no-diffs \
            "${targets[@]}" || status=$?
          if [ -f mutago-summary.json ]; then
            mv mutago-summary.json "mutago-summary-nightly-${{ matrix.name }}.json"
          fi
          exit "$status"

      - name: Preserve full mutation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: full-mutation-${{ matrix.name }}
          path: mutago-summary-nightly-${{ matrix.name }}.json
          if-no-files-found: error
          retention-days: 30
