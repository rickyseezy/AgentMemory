name: PF-001 integration

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/pf001-integration.yml"
      - "go.mod"
      - "go.sum"
      - "pyproject.toml"
      - "uv.lock"
      - "apps/launcher/**"
      - "deploy/**"
      - "migrations/**"
      - "src/**"
      - "tests/graph/**"
  push:
    branches:
      - main
      - "codex/**"
    paths:
      - ".github/workflows/pf001-integration.yml"
      - "go.mod"
      - "go.sum"
      - "pyproject.toml"
      - "uv.lock"
      - "apps/launcher/**"
      - "deploy/**"
      - "migrations/**"
      - "src/**"
      - "tests/graph/**"

permissions:
  contents: read

concurrency:
  group: pf001-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  local-stack:
    name: Pinned local stack and Compose conformance
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install the pinned Go toolchain
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.26.5"
          check-latest: false
          cache: true
          cache-dependency-path: go.mod

      - name: Verify the exact reviewed Compose executable
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 0700 "$RUNNER_TEMP/agentmemory-tools"
          curl --fail --location --proto '=https' --tlsv1.3 \
            --output "$RUNNER_TEMP/agentmemory-tools/docker-compose" \
            https://github.com/docker/compose/releases/download/v5.1.4/docker-compose-linux-x86_64
          printf '%s  %s\n' \
            '33b208d7e76639db742fae84b966cc01dacae58ca3fc4dabbc907045aefdf0c4' \
            "$RUNNER_TEMP/agentmemory-tools/docker-compose" | sha256sum --check --strict
          chmod 0555 "$RUNNER_TEMP/agentmemory-tools/docker-compose"
          test "$($RUNNER_TEMP/agentmemory-tools/docker-compose version --short)" = "5.1.4"

      - name: Build every pinned PF-001 runtime image without pulling at test time
        shell: bash
        run: |
          set -euo pipefail
          docker build --pull=false --file deploy/docker/core.Dockerfile \
            --target core --tag agentmemory/core:pf001 .
          docker build --pull=false --file deploy/docker/core.Dockerfile \
            --target migrate --tag agentmemory/migrate:pf001 .
          docker build --pull=false --file deploy/docker/neo4j.Dockerfile \
            --tag agentmemory/neo4j:pf001 .
          docker build --pull=false --file deploy/docker/provider.Dockerfile \
            --tag agentmemory/provider:pf001 .
          docker build --pull=false --file deploy/docker/provider-gateway.Dockerfile \
            --tag agentmemory/provider-gateway:pro009 .
          docker build --pull=false --file deploy/docker/secret-projector.Dockerfile \
            --tag agentmemory/secret-projector:pf001 .
          docker build --pull=false --file deploy/docker/capacity-helper.Dockerfile \
            --tag agentmemory/capacity-helper:pf001 .

      - name: Verify exact reviewed runtime image identities
        shell: bash
        run: |
          set -euo pipefail
          for binding in \
            'agentmemory/core:pf001=10001:10001' \
            'agentmemory/migrate:pf001=10001:10001' \
            'agentmemory/neo4j:pf001=7474:7474' \
            'agentmemory/provider:pf001=10001:10001' \
            'agentmemory/provider-gateway:pro009=10001:10001' \
            'agentmemory/secret-projector:pf001=0:0' \
            'agentmemory/capacity-helper:pf001=10001:10001'
          do
            image="${binding%%=*}"
            expected_user="${binding#*=}"
            test -n "$(docker image inspect --format '{{.Id}}' "$image")"
            test "$(docker image inspect --format '{{.Config.User}}' "$image")" = "$expected_user"
          done

      - name: Exercise protected projection, pristine migration, and exact Compose rendering
        env:
          AGENTMEMORY_COMPOSE_CONFORMANCE: "1"
          AGENTMEMORY_SECRET_PROJECTOR_IMAGE: agentmemory/secret-projector:pf001
          AGENTMEMORY_TEST_COMPOSE_EXECUTABLE: ${{ runner.temp }}/agentmemory-tools/docker-compose
          AGENTMEMORY_TEST_DOCKER_ENDPOINT: unix:///var/run/docker.sock
          AGENTMEMORY_TEST_MIGRATE_IMAGE: agentmemory/migrate:pf001
          AGENTMEMORY_TEST_NEO4J_IMAGE: agentmemory/neo4j:pf001
        run: |
          go test -race -shuffle=on -count=1 \
            ./apps/launcher/internal/secretprojector \
            ./apps/launcher/internal/adapters/dockercli

      - name: Install the pinned Python and uv toolchain
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14.6"
          check-latest: false

      - name: Install the pinned uv package manager
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.11.28"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Restore the exact reviewed Python environment
        run: uv sync --frozen --all-groups

      - name: Prove GRA-001 against pinned Neo4j Community
        shell: bash
        run: |
          set -euo pipefail
          secret_volume=agentmemory-gra001-secret-${GITHUB_RUN_ID}
          secret_file="$RUNNER_TEMP/agentmemory-gra001-neo4j-password"
          cleanup() {
            docker rm --force agentmemory-gra001-neo4j >/dev/null 2>&1 || true
            docker volume rm "$secret_volume" >/dev/null 2>&1 || true
            rm --force "$secret_file"
          }
          trap cleanup EXIT
          printf '0123456789abcdef0123456789abcdef' > "$secret_file"
          chmod 0600 "$secret_file"
          docker volume create "$secret_volume" >/dev/null
          docker run --rm --user 0:0 --entrypoint /bin/sh \
            --volume "$secret_volume:/run/secrets" agentmemory/neo4j:pf001 \
            -c "printf '0123456789abcdef0123456789abcdef' > \
              /run/secrets/agentmemory_neo4j_password && \
              chown 7474:7474 /run/secrets/agentmemory_neo4j_password && \
              chmod 0400 /run/secrets/agentmemory_neo4j_password"
          docker run --detach --name agentmemory-gra001-neo4j \
            --publish 17687:7687 \
            --volume "$secret_volume:/run/secrets:ro" \
            agentmemory/neo4j:pf001
          for attempt in $(seq 1 90); do
            status=$(docker inspect --format '{{.State.Health.Status}}' \
              agentmemory-gra001-neo4j)
            if [ "$status" = healthy ]; then
              break
            fi
            if [ "$status" = unhealthy ] || [ "$attempt" = 90 ]; then
              docker logs agentmemory-gra001-neo4j
              exit 1
            fi
            sleep 2
          done
          AGENTMEMORY_TEST_NEO4J_URI=bolt://127.0.0.1:17687 \
          AGENTMEMORY_TEST_NEO4J_PASSWORD_FILE="$secret_file" \
            uv run pytest -q tests/graph/test_gra001_neo4j_integration.py

      - name: Prove release images remain present and locally addressed
        shell: bash
        run: |
          set -euo pipefail
          docker image inspect \
            agentmemory/core:pf001 \
            agentmemory/migrate:pf001 \
            agentmemory/neo4j:pf001 \
            agentmemory/provider:pf001 \
            agentmemory/provider-gateway:pro009 \
            agentmemory/secret-projector:pf001 \
            agentmemory/capacity-helper:pf001 \
            --format '{{.RepoTags}} {{.Id}}'
