name: PF-001 immutable release promotion

on:
  workflow_dispatch:
    inputs:
      version:
        description: Stable SemVer core matching the selected v-prefixed tag
        required: true
        type: string
      qualification_run_id:
        description: Successful PF-001 release qualification workflow run ID
        required: true
        type: string
      qualification_artifact:
        description: Exact attested qualified-candidate artifact name
        required: true
        type: string

permissions:
  actions: read
  attestations: write
  contents: write
  id-token: write

concurrency:
  group: pf001-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  promote:
    name: Verify and publish exact qualified objects
    if: github.repository == 'rickyseezy/AgentMemory'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: pf001-production-release
    env:
      GH_TOKEN: ${{ github.token }}
      QUALIFIED_ROOT: ${{ github.workspace }}/build/release/qualified
      PUBLISH_ROOT: ${{ github.workspace }}/build/release/publish
      TAG: v${{ inputs.version }}
    steps:
      - name: Check out the exact tagged release source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Install the pinned Go toolchain
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.26.5"
          check-latest: false
          cache: true
          cache-dependency-path: go.mod

      - name: Install the pinned Cosign verifier and signer
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.1

      - name: Fail closed unless release publication is immutable and tag-bound
        shell: bash
        run: |
          set -euo pipefail
          [[ '${{ inputs.version }}' =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          test "$GITHUB_REF_TYPE" = tag
          test "$GITHUB_REF_NAME" = "$TAG"
          test "$(git rev-list -n 1 "$TAG")" = "$GITHUB_SHA"
          test "$(git status --porcelain=v1 --untracked-files=all)" = ''
          gh api \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/$GITHUB_REPOSITORY/immutable-releases" \
            --jq '.enabled == true' | grep -Fxq true
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'Release tag already has a publication' >&2
            exit 1
          fi

      - name: Download the exact qualification output
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.qualification_artifact }}
          path: ${{ github.workspace }}/build/release/qualified
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.qualification_run_id }}

      - name: Verify every candidate provenance attestation
        shell: bash
        run: |
          set -euo pipefail
          test -d "$QUALIFIED_ROOT/candidate"
          test -f "$QUALIFIED_ROOT/publication.json"
          count=0
          while IFS= read -r -d '' subject; do
            gh attestation verify "$subject" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/pf001-release-qualification.yml" \
              --signer-digest "$GITHUB_SHA" \
              --source-digest "$GITHUB_SHA" \
              --source-ref "$GITHUB_REF" \
              --deny-self-hosted-runners >/dev/null
            count=$((count + 1))
          done < <(find "$QUALIFIED_ROOT" -type f -print0 | sort -z)
          test "$count" -eq 34

      - name: Rehash the closed candidate and bind selected release identity
        shell: bash
        run: |
          set -euo pipefail
          go run ./apps/launcher/cmd/agentmemory-publication-record \
            -candidate-root "$QUALIFIED_ROOT/candidate" \
            -verify-record "$QUALIFIED_ROOT/publication.json"
          test "$(jq -r '.version' "$QUALIFIED_ROOT/publication.json")" = '${{ inputs.version }}'
          test "$(jq -r '.source_commit' "$QUALIFIED_ROOT/publication.json")" = "$GITHUB_SHA"
          test "$(jq -r '.schema_version' "$QUALIFIED_ROOT/publication.json")" = 1

      - name: Stage the exact publish set without rebuilding
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 0700 "$PUBLISH_ROOT"
          install -m 0600 "$QUALIFIED_ROOT/publication.json" \
            "$PUBLISH_ROOT/agentmemory-release-publication.json"
          install -m 0600 "$QUALIFIED_ROOT/candidate/distribution-manifest.json" \
            "$PUBLISH_ROOT/distribution-manifest.json"
          find "$QUALIFIED_ROOT/candidate/objects" "$QUALIFIED_ROOT/candidate/evidence" \
            -mindepth 1 -maxdepth 1 -type f -exec install -m 0600 '{}' "$PUBLISH_ROOT/" ';'
          test "$(find "$PUBLISH_ROOT" -mindepth 1 -maxdepth 1 -type f | wc -l | tr -d ' ')" -eq 34

      - name: Sign and immediately verify the publication authority
        shell: bash
        run: |
          set -euo pipefail
          identity="https://github.com/$GITHUB_REPOSITORY/.github/workflows/pf001-release.yml@$GITHUB_REF"
          cosign sign-blob --yes \
            --bundle "$PUBLISH_ROOT/agentmemory-release-publication.sigstore.json" \
            "$PUBLISH_ROOT/agentmemory-release-publication.json"
          cosign verify-blob \
            --bundle "$PUBLISH_ROOT/agentmemory-release-publication.sigstore.json" \
            --certificate-identity "$identity" \
            --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
            "$PUBLISH_ROOT/agentmemory-release-publication.json"
          test "$(find "$PUBLISH_ROOT" -mindepth 1 -maxdepth 1 -type f | wc -l | tr -d ' ')" -eq 35

      - name: Attest the complete exact promotion set
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: ${{ github.workspace }}/build/release/publish/*

      - name: Reverify candidates after signing and before publication
        shell: bash
        run: |
          set -euo pipefail
          go run ./apps/launcher/cmd/agentmemory-publication-record \
            -candidate-root "$QUALIFIED_ROOT/candidate" \
            -verify-record "$QUALIFIED_ROOT/publication.json"
          while IFS= read -r -d '' subject; do
            gh attestation verify "$subject" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/pf001-release.yml" \
              --signer-digest "$GITHUB_SHA" \
              --source-digest "$GITHUB_SHA" \
              --source-ref "$GITHUB_REF" \
              --deny-self-hosted-runners >/dev/null
          done < <(find "$PUBLISH_ROOT" -type f -print0 | sort -z)

      - name: Publish one immutable release from exact objects
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$TAG" "$PUBLISH_ROOT"/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --fail-on-no-commits \
            --latest \
            --title "AgentMemory ${{ inputs.version }}" \
            --notes 'Production AgentMemory local Brain release. Verify agentmemory-release-publication.json and its Sigstore bundle before installation.'

      - name: Prove every immutable release asset matches local bytes
        shell: bash
        run: |
          set -euo pipefail
          release_id=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq '.id')
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases/$release_id/assets?per_page=100" \
            --jq '.[] | [.name, .size, .digest] | @tsv' | sort > "$RUNNER_TEMP/published-assets.tsv"
          test "$(wc -l < "$RUNNER_TEMP/published-assets.tsv" | tr -d ' ')" -eq 35
          while IFS= read -r -d '' local_asset; do
            name=$(basename "$local_asset")
            size=$(stat --format='%s' "$local_asset")
            digest="sha256:$(sha256sum "$local_asset" | cut -d ' ' -f 1)"
            grep -Fqx "$name"$'\t'"$size"$'\t'"$digest" "$RUNNER_TEMP/published-assets.tsv"
          done < <(find "$PUBLISH_ROOT" -type f -print0 | sort -z)

      - name: Remove only an unpublished draft after a failed promotion
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          if test "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft' 2>/dev/null || true)" = true; then
            gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes
          fi
