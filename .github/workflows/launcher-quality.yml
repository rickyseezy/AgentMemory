name: Launcher quality

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"
  pull_request:
    paths:
      - ".github/workflows/launcher-quality.yml"
      - ".golangci.yml"
      - "go.mod"
      - "go.sum"
      - "apps/launcher/**"
      - "tools/**"
  push:
    branches:
      - main
      - "codex/**"
    paths:
      - ".github/workflows/launcher-quality.yml"
      - ".golangci.yml"
      - "go.mod"
      - "go.sum"
      - "apps/launcher/**"
      - "tools/**"

permissions:
  contents: read

concurrency:
  group: launcher-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, architecture, race, and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Install the pinned Go toolchain
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.26.5"
          check-latest: false
          cache: true
          cache-dependency-path: go.mod

      - name: Verify module files
        run: |
          go mod tidy -diff
          go mod verify

      - name: Verify Clean Architecture
        run: go run ./tools/check_launcher_architecture

      - name: Vet launcher and quality tools
        run: go vet ./apps/launcher/... ./tools/...

      - name: Run standalone Staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.7.0 ./apps/launcher/... ./tools/...

      - name: Scan reachable Go vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.4.0 ./apps/launcher/... ./tools/...

      - name: Run strict lint configuration
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2
          args: ./apps/launcher/... ./tools/...
          only-new-issues: false

      - name: Run race tests with randomized ordering
        run: |
          mkdir -p build
          go test -race -shuffle=on -count=1 -covermode=atomic \
            -coverprofile=build/go-cover.out ./apps/launcher/... ./tools/...

      - name: Fuzz installer state transitions
        env:
          FUZZ_TIME: ${{ github.event_name == 'schedule' && '2m' || '10s' }}
        run: |
          go test ./apps/launcher/internal/domain/install \
            -run=^$ \
            -fuzz=FuzzPF001ReadyRequiresEveryOrderedPhase \
            -fuzztime="$FUZZ_TIME"

      - name: Fuzz durable journal authentication
        env:
          FUZZ_TIME: ${{ github.event_name == 'schedule' && '2m' || '10s' }}
        run: |
          go test ./apps/launcher/internal/adapters/filesystem \
            -run=^$ \
            -fuzz=FuzzPF001InstallJournalRejectsUnauthenticatedBytes \
            -fuzztime="$FUZZ_TIME"

      - name: Enforce launcher coverage policy
        run: |
          go run ./tools/check_go_coverage \
            -profile build/go-cover.out \
            -root . \
            -base origin/main \
            -package 80 \
            -changed 90

  cross-platform:
    name: Unit tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install the pinned Go toolchain
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.26.5"
          check-latest: false
          cache: true
          cache-dependency-path: go.mod

      - name: Run launcher tests
        run: go test -race -shuffle=on -count=1 ./apps/launcher/...
