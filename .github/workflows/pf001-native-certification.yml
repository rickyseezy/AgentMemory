name: PF-001 native clean-host certification

on:
  workflow_dispatch:
    inputs:
      version:
        description: Stable SemVer core matching the selected v-prefixed final tag
        required: true
        type: string
      build_run_id:
        description: Successful trusted PF-001 host-package-build workflow run ID
        required: true
        type: string
      build_artifact:
        description: Exact attested host-package candidate artifact name
        required: true
        type: string
      campaign_release_tag:
        description: Immutable release tag carrying the independently signed clean-host campaign
        required: true
        type: string
      campaign_asset_name:
        description: Exact canonical native certification ZIP asset name
        required: true
        type: string
      campaign_asset_sha256:
        description: Exact lowercase SHA-256 of the canonical campaign asset
        required: true
        type: string

permissions:
  actions: read
  attestations: write
  contents: read
  id-token: write

concurrency:
  group: pf001-native-certification-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    name: Bind immutable campaign and generate closed matrix
    if: github.repository == 'rickyseezy/AgentMemory'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: pf001-native-certification
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    env:
      GH_TOKEN: ${{ github.token }}
      FINAL_TAG: v${{ inputs.version }}
      VERSION: ${{ inputs.version }}
      BUILD_RUN_ID: ${{ inputs.build_run_id }}
      BUILD_ARTIFACT: ${{ inputs.build_artifact }}
      CAMPAIGN_TAG: ${{ inputs.campaign_release_tag }}
      CAMPAIGN_ASSET_NAME: ${{ inputs.campaign_asset_name }}
      CAMPAIGN_ASSET_SHA256: ${{ inputs.campaign_asset_sha256 }}
    steps:
      - name: Check out exact tagged source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Install the pinned Go toolchain
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.26.5"
          check-latest: false
          cache: true
          cache-dependency-path: go.mod

      - name: Fail closed unless source and campaign release are immutable
        shell: bash
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          [[ "$BUILD_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$BUILD_ARTIFACT" =~ ^pf001-host-package-build-[0-9a-f]{40}-[1-9][0-9]*$ ]]
          [[ "$CAMPAIGN_ASSET_SHA256" =~ ^[0-9a-f]{64}$ ]]
          test "$GITHUB_REF_TYPE" = tag
          test "$GITHUB_REF_NAME" = "$FINAL_TAG"
          test "$(git rev-list -n 1 "$FINAL_TAG")" = "$GITHUB_SHA"
          prefix="native-cert-v$VERSION-$GITHUB_SHA-"
          case "$CAMPAIGN_TAG" in
            "$prefix"*) ;;
            *) echo 'Campaign release tag is not bound to this version and source' >&2; exit 1 ;;
          esac
          campaign_id=$CAMPAIGN_TAG
          campaign_id=${campaign_id#"$prefix"}
          [[ "$campaign_id" =~ ^[a-z0-9][a-z0-9._-]{0,63}$ ]]
          test "$CAMPAIGN_ASSET_NAME" = "agentmemory-$CAMPAIGN_TAG.zip"
          test "$(git rev-list -n 1 "$CAMPAIGN_TAG")" = "$GITHUB_SHA"
          test "$(git status --porcelain=v1 --untracked-files=all)" = ''
          gh api \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/$GITHUB_REPOSITORY/immutable-releases" \
            --jq '.enabled == true' | grep -Fxq true
          gh api \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/$GITHUB_REPOSITORY/releases/tags/$CAMPAIGN_TAG" \
            --jq '.draft == false and .immutable == true and .target_commitish != null' | grep -Fxq true
          gh release verify "$CAMPAIGN_TAG" --repo "$GITHUB_REPOSITORY"

      - name: Validate executable support matrix
        id: matrix
        shell: bash
        run: |
          set -euo pipefail
          go run ./tools/check_pf001_certification
          matrix=$(go run ./tools/check_pf001_certification -emit-github-matrix)
          test "$(jq '.include | length' <<<"$matrix")" -eq 7
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  verify-cell:
    name: Verify signed evidence (${{ matrix.cell_id }}, ${{ matrix.trial_count }} trials)
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: pf001-native-certification
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      GH_TOKEN: ${{ github.token }}
      CERTIFICATION_PUBLIC_KEY: ${{ vars.AGENTMEMORY_NATIVE_CERTIFICATION_PUBLIC_KEY_BASE64 }}
      VERSION: ${{ inputs.version }}
      CAMPAIGN_TAG: ${{ inputs.campaign_release_tag }}
      CAMPAIGN_ASSET_NAME: ${{ inputs.campaign_asset_name }}
      CAMPAIGN_ASSET_SHA256: ${{ inputs.campaign_asset_sha256 }}
      REQUIRED_CELL: ${{ matrix.cell_id }}
    steps:
      - name: Check out exact tagged source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install the pinned Go toolchain
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.26.5"
          check-latest: false
          cache: true
          cache-dependency-path: go.mod

      - name: Download exact attested publication candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.build_artifact }}
          path: ${{ runner.temp }}/release-build
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.build_run_id }}

      - name: Download and verify immutable campaign asset
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 0700 "$RUNNER_TEMP/native-campaign"
          gh release download "$CAMPAIGN_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "$CAMPAIGN_ASSET_NAME" \
            --dir "$RUNNER_TEMP/native-campaign"
          asset="$RUNNER_TEMP/native-campaign/$CAMPAIGN_ASSET_NAME"
          test -f "$asset"
          printf '%s  %s\n' "$CAMPAIGN_ASSET_SHA256" "$asset" | sha256sum --check --strict
          gh release verify-asset "$CAMPAIGN_TAG" "$asset" --repo "$GITHUB_REPOSITORY"

      - name: Reverify publication and exact required cell
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/release-build"
          go run ./apps/launcher/cmd/agentmemory-publication-record \
            -candidate-root "$root/candidate" \
            -verify-record "$root/publication.json"
          gh attestation verify "$root/publication.json" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/pf001-host-package-build.yml" \
            --signer-digest "$GITHUB_SHA" \
            --source-digest "$GITHUB_SHA" \
            --source-ref "$GITHUB_REF" \
            --deny-self-hosted-runners >/dev/null
          go run ./tools/check_pf001_certification \
            -bundle "$RUNNER_TEMP/native-campaign/$CAMPAIGN_ASSET_NAME" \
            -publication "$root/publication.json" \
            -public-key-base64 "$CERTIFICATION_PUBLIC_KEY" \
            -expected-version "$VERSION" \
            -expected-source-commit "$GITHUB_SHA" \
            -verification-time-unix "$(date -u +%s)" \
            -required-cell "$REQUIRED_CELL"

  finalize:
    name: Attest exact complete native certification bundle
    needs: [plan, verify-cell]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: pf001-native-certification
    env:
      GH_TOKEN: ${{ github.token }}
      CERTIFICATION_PUBLIC_KEY: ${{ vars.AGENTMEMORY_NATIVE_CERTIFICATION_PUBLIC_KEY_BASE64 }}
      VERSION: ${{ inputs.version }}
      CAMPAIGN_TAG: ${{ inputs.campaign_release_tag }}
      CAMPAIGN_ASSET_NAME: ${{ inputs.campaign_asset_name }}
      CAMPAIGN_ASSET_SHA256: ${{ inputs.campaign_asset_sha256 }}
    steps:
      - name: Check out exact tagged source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install the pinned Go toolchain
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.26.5"
          check-latest: false
          cache: true
          cache-dependency-path: go.mod

      - name: Download exact attested publication candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.build_artifact }}
          path: ${{ runner.temp }}/release-build
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.build_run_id }}

      - name: Download immutable complete campaign once more
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 0700 "$RUNNER_TEMP/native-campaign" "$RUNNER_TEMP/certified"
          gh release download "$CAMPAIGN_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "$CAMPAIGN_ASSET_NAME" \
            --dir "$RUNNER_TEMP/native-campaign"
          asset="$RUNNER_TEMP/native-campaign/$CAMPAIGN_ASSET_NAME"
          printf '%s  %s\n' "$CAMPAIGN_ASSET_SHA256" "$asset" | sha256sum --check --strict
          gh release verify-asset "$CAMPAIGN_TAG" "$asset" --repo "$GITHUB_REPOSITORY"
          go run ./tools/check_pf001_certification \
            -bundle "$asset" \
            -publication "$RUNNER_TEMP/release-build/publication.json" \
            -public-key-base64 "$CERTIFICATION_PUBLIC_KEY" \
            -expected-version "$VERSION" \
            -expected-source-commit "$GITHUB_SHA" \
            -verification-time-unix "$(date -u +%s)"
          install -m 0600 "$asset" "$RUNNER_TEMP/certified/agentmemory-native-certification.zip"

      - name: Attest exact native certification bundle on a hosted runner
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: ${{ runner.temp }}/certified/agentmemory-native-certification.zip

      - name: Retain exact certification for release qualification
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pf001-native-certification-${{ github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/certified/agentmemory-native-certification.zip
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          include-hidden-files: false
