name: PF-001 release qualification

on:
  workflow_dispatch:
    inputs:
      version:
        description: Stable SemVer core matching the selected v-prefixed tag
        required: true
        type: string
      build_run_id:
        description: Successful trusted PF-001 host-package-build workflow run ID
        required: true
        type: string
      build_artifact:
        description: Exact signed host-package candidate artifact name
        required: true
        type: string

permissions:
  actions: read
  attestations: write
  contents: read
  id-token: write

concurrency:
  group: pf001-release-qualification-${{ github.ref }}
  cancel-in-progress: false

jobs:
  retained-bundle:
    name: Full offline authority and package selection
    if: github.repository == 'rickyseezy/AgentMemory'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: pf001-release-qualification
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: v${{ inputs.version }}
    steps:
      - name: Check out exact tagged source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Install the pinned Go toolchain
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.26.5"
          check-latest: false
          cache: true
          cache-dependency-path: go.mod

      - name: Install the pinned Cosign verifier
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.1

      - name: Download exact signed host-package candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.build_artifact }}
          path: ${{ runner.temp }}/release-build
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.build_run_id }}

      - name: Verify tag, source, host-candidate provenance, and closed record
        shell: bash
        run: |
          set -euo pipefail
          [[ '${{ inputs.version }}' =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          test "$GITHUB_REF_TYPE" = tag
          test "$GITHUB_REF_NAME" = "$TAG"
          test "$(git rev-list -n 1 "$TAG")" = "$GITHUB_SHA"
          test "$(git status --porcelain=v1 --untracked-files=all)" = ''
          root="$RUNNER_TEMP/release-build"
          test -d "$root/candidate"
          test -d "$root/bootstrap"
          test -d "$root/host-packages"
          test -f "$root/publication.json"
          test -f "$root/publication.sigstore.json"
          count=0
          while IFS= read -r -d '' subject; do
            gh attestation verify "$subject" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/pf001-host-package-build.yml" \
              --signer-digest "$GITHUB_SHA" \
              --source-digest "$GITHUB_SHA" \
              --source-ref "$GITHUB_REF" \
              --deny-self-hosted-runners >/dev/null
            count=$((count + 1))
          done < <(find "$root" -type f -print0 | sort -z)
          test "$count" -eq 116
          go run ./apps/launcher/cmd/agentmemory-publication-record \
            -candidate-root "$root/candidate" \
            -verify-record "$root/publication.json"
          test "$(jq -r '.version' "$root/publication.json")" = '${{ inputs.version }}'
          test "$(jq -r '.source_commit' "$root/publication.json")" = "$GITHUB_SHA"

      - name: Verify and reproduce every host package before native qualification
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/release-build"
          identity="https://github.com/$GITHUB_REPOSITORY/.github/workflows/pf001-host-package-build.yml@$GITHUB_REF"
          cosign verify-blob \
            --bundle "$root/publication.sigstore.json" \
            --certificate-identity "$identity" \
            --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
            "$root/publication.json"
          while IFS= read -r -d '' subject; do
            cosign verify-blob \
              --bundle "$subject.sigstore.json" \
              --certificate-identity "$identity" \
              --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
              "$subject"
          done < <(find "$root/host-packages" -type f ! -name '*.sigstore.json' -print0 | sort -z)
          rebuilt="$RUNNER_TEMP/rebuilt-host-packages"
          install -d -m 0700 "$rebuilt"
          source_epoch=$(jq -r '.build_timestamp' "$root/publication.json")
          source_commit=$(jq -r '.source_commit' "$root/publication.json")
          for cell in darwin/amd64 darwin/arm64 linux/amd64 linux/arm64 windows/amd64; do
            os=${cell%/*}
            arch=${cell#*/}
            bootstrap="$root/bootstrap/agentmemory-bootstrap-$os-$arch"
            if test "$os" = windows; then bootstrap="$bootstrap.exe"; fi
            id="agentmemory-bootstrap-$os-$arch"
            for host in claude gemini generic; do
              extension=zip
              if test "$host" = claude; then extension=mcpb; fi
              name="agentmemory-$host-$os-$arch.$extension"
              package="$rebuilt/$name"
              record="$package.record.json"
              go run ./apps/launcher/cmd/agentmemory-host-package \
                -candidate-root "$root/candidate" \
                -publication "$root/publication.json" \
                -publication-sigstore "$root/publication.sigstore.json" \
                -bootstrap "$bootstrap" \
                -bootstrap-sigstore "$root/bootstrap/evidence/$id.sigstore.json" \
                -trust "$root/candidate/release-trust.json" \
                -output "$package" \
                -record-output "$record" \
                -host "$host" \
                -os "$os" \
                -arch "$arch" \
                -version '${{ inputs.version }}' \
                -source-commit "$source_commit" \
                -source-date-epoch "$source_epoch"
              cmp "$package" "$root/host-packages/$name"
              cmp "$record" "$root/host-packages/$name.record.json"
              unzip -t "$package" >/dev/null
            done
          done
          test "$(find "$rebuilt" -type f | wc -l | tr -d ' ')" -eq 30

      - name: Verify every package's offline Sigstore bundle
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/release-build/candidate"
          identity="https://github.com/$GITHUB_REPOSITORY/.github/workflows/pf001-release-build.yml@$GITHUB_REF"
          for object in "$root"/objects/*; do
            name=$(basename "$object")
            id=${name%.tar.zst}
            id=${id%.pkg}
            id=${id%.msi}
            id=${id%.deb}
            id=${id%.rpm}
            cosign verify-blob \
              --bundle "$root/evidence/$id.sigstore.json" \
              --certificate-identity "$identity" \
              --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
              "$object"
          done

      - name: Safely expand and verify the complete retained offline bundle
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/release-build/candidate"
          archive="$root/objects/agentmemory-offline-bundle.tar.zst"
          extraction="$RUNNER_TEMP/offline-extraction"
          install -d -m 0700 "$extraction"
          if tar --zstd --list --file "$archive" | \
            awk 'BEGIN { bad=0 } /^\// || /(^|\/)\.\.($|\/)/ || /\\/ { bad=1 } END { exit bad }'; then
            :
          else
            echo 'Offline bundle contains an unsafe path' >&2
            exit 1
          fi
          tar --zstd --extract --file "$archive" --directory "$extraction" \
            --no-same-owner --no-same-permissions
          test -d "$extraction/bundle"
          test "$(find "$extraction" -mindepth 1 -maxdepth 1 -type d | wc -l | tr -d ' ')" -eq 1
          test "$(find "$extraction" -mindepth 1 -maxdepth 1 -type f | wc -l | tr -d ' ')" -eq 0
          source_epoch=$(jq -r '.build_timestamp' "$RUNNER_TEMP/release-build/publication.json")
          verification_epoch=$(date -u +%s)
          for cell in darwin/amd64 darwin/arm64 windows/amd64; do
            os=${cell%/*}
            arch=${cell#*/}
            go run ./apps/launcher/cmd/agentmemory-native-package-stage \
              -root . \
              -bundle "$extraction/bundle" \
              -trust "$root/release-trust.json" \
              -output "$RUNNER_TEMP/stage-$os-$arch" \
              -os "$os" \
              -arch "$arch" \
              -source-date-epoch "$source_epoch" \
              -verification-epoch "$verification_epoch"
          done
          for arch in amd64 arm64; do
            go run ./apps/launcher/cmd/agentmemory-linux-release \
              -root . \
              -bundle "$extraction/bundle" \
              -trust "$root/release-trust.json" \
              -output "$RUNNER_TEMP/stage-linux-$arch" \
              -arch "$arch" \
              -source-date-epoch "$source_epoch" \
              -verification-epoch "$verification_epoch"
          done

  macos-package:
    name: Native macOS package (${{ matrix.arch }})
    needs: retained-bundle
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    environment: pf001-release-qualification
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: amd64
          - runner: macos-15
            arch: arm64
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out exact tagged source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install the pinned Go toolchain
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.26.5"
          check-latest: false
          cache: true
          cache-dependency-path: go.mod

      - name: Download exact release-build candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.build_artifact }}
          path: ${{ runner.temp }}/release-build
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.build_run_id }}

      - name: Rehash and verify Developer ID, notarization, and payload signatures
        env:
          EXPECTED_TEAM_ID: ${{ vars.AGENTMEMORY_APPLE_TEAM_ID }}
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/release-build"
          go run ./apps/launcher/cmd/agentmemory-publication-record \
            -candidate-root "$root/candidate" \
            -verify-record "$root/publication.json"
          [[ "$EXPECTED_TEAM_ID" =~ ^[A-Z0-9]{10}$ ]]
          package="$root/candidate/objects/agentmemory-darwin-${{ matrix.arch }}-pkg.pkg"
          pkgutil --check-signature "$package" | tee "$RUNNER_TEMP/package-signature.txt"
          grep -Fq "($EXPECTED_TEAM_ID)" "$RUNNER_TEMP/package-signature.txt"
          xcrun stapler validate "$package"
          spctl --assess --verbose=4 --type install "$package"
          pkgutil --payload-files "$package" | tee "$RUNNER_TEMP/package-payload.txt"
          grep -Fxq './usr/local/bin/agentmemory' "$RUNNER_TEMP/package-payload.txt"
          grep -Fxq './Library/PrivilegedHelperTools/com.rickyseezy.agentmemory.runtime-helper' \
            "$RUNNER_TEMP/package-payload.txt"
          pkgutil --expand-full "$package" "$RUNNER_TEMP/expanded"

          offline="$RUNNER_TEMP/offline"
          install -d -m 0700 "$offline"
          archive="$root/candidate/objects/agentmemory-offline-bundle.tar.zst"
          if tar --zstd --list --file "$archive" | \
            awk 'BEGIN { bad=0 } /^\// || /(^|\/)\.\.($|\/)/ || /\\/ { bad=1 } END { exit bad }'; then
            :
          else
            echo 'Offline bundle contains an unsafe path' >&2
            exit 1
          fi
          tar --zstd --extract --file "$archive" --directory "$offline" \
            --no-same-owner --no-same-permissions
          expected="$RUNNER_TEMP/expected-stage"
          source_epoch=$(jq -r '.build_timestamp' "$root/publication.json")
          go run ./apps/launcher/cmd/agentmemory-native-package-stage \
            -root . \
            -bundle "$offline/bundle" \
            -trust "$root/candidate/release-trust.json" \
            -output "$expected" \
            -os darwin \
            -arch '${{ matrix.arch }}' \
            -source-date-epoch "$source_epoch" \
            -verification-epoch "$(date -u +%s)"

          actual_payload=$(find "$RUNNER_TEMP/expanded" -type d -name Payload -print)
          test "$(printf '%s\n' "$actual_payload" | grep -c .)" -eq 1
          test -z "$(find "$actual_payload" -type l -print -quit)"
          test "$(find "$expected/payload" -type f | wc -l | tr -d ' ')" = \
            "$(find "$actual_payload" -type f | wc -l | tr -d ' ')"
          while IFS= read -r -d '' expected_file; do
            relative=${expected_file#"$expected/payload/"}
            cmp "$expected_file" "$actual_payload/$relative"
          done < <(find "$expected/payload" -type f -print0 | sort -z)

          launcher=$(find "$RUNNER_TEMP/expanded" -path '*/Payload/usr/local/bin/agentmemory' -type f -print -quit)
          helper=$(find "$RUNNER_TEMP/expanded" \
            -path '*/Payload/Library/PrivilegedHelperTools/com.rickyseezy.agentmemory.runtime-helper' \
            -type f -print -quit)
          test -n "$launcher"
          test -n "$helper"
          for executable in "$launcher" "$helper"; do
            codesign --verify --strict --verbose=4 "$executable"
            codesign --display --verbose=4 "$executable" 2>&1 | grep -Fq "TeamIdentifier=$EXPECTED_TEAM_ID"
          done
          bootstrap="$root/bootstrap/agentmemory-bootstrap-darwin-${{ matrix.arch }}"
          codesign --verify --strict --verbose=4 "$bootstrap"
          codesign --display --verbose=4 "$bootstrap" 2>&1 | grep -Fq "TeamIdentifier=$EXPECTED_TEAM_ID"
          spctl --assess --verbose=4 --type execute "$bootstrap"

  windows-package:
    name: Native Windows package (amd64)
    needs: retained-bundle
    runs-on: windows-2025
    timeout-minutes: 20
    environment: pf001-release-qualification
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out exact tagged source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install the pinned Go toolchain
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.26.5"
          check-latest: false
          cache: true
          cache-dependency-path: go.mod

      - name: Download exact release-build candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.build_artifact }}
          path: ${{ runner.temp }}/release-build
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.build_run_id }}

      - name: Rehash and verify Authenticode MSI and installed payload
        env:
          EXPECTED_CERTIFICATE_SHA256: ${{ vars.AGENTMEMORY_WINDOWS_CERTIFICATE_SHA256 }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'release-build'
          go run ./apps/launcher/cmd/agentmemory-publication-record `
            -candidate-root (Join-Path $root 'candidate') `
            -verify-record (Join-Path $root 'publication.json')
          if ($env:EXPECTED_CERTIFICATE_SHA256 -cnotmatch '^[0-9A-F]{64}$') {
            throw 'Expected Windows signer certificate SHA-256 is unavailable'
          }
          function Assert-ExactSignature([string]$Path) {
            $signature = Get-AuthenticodeSignature -LiteralPath $Path
            if ($signature.Status -ne [System.Management.Automation.SignatureStatus]::Valid -or
              $null -eq $signature.SignerCertificate) {
              throw "Authenticode verification failed for $Path"
            }
            $actual = [Convert]::ToHexString(
              [Security.Cryptography.SHA256]::HashData($signature.SignerCertificate.RawData)
            )
            if ($actual -cne $env:EXPECTED_CERTIFICATE_SHA256) {
              throw "Authenticode signer changed for $Path"
            }
          }
          $package = Join-Path $root 'candidate/objects/agentmemory-windows-amd64-msi.msi'
          Assert-ExactSignature $package
          $expanded = Join-Path $env:RUNNER_TEMP 'expanded-msi'
          New-Item -ItemType Directory -Path $expanded | Out-Null
          $process = Start-Process msiexec.exe `
            -ArgumentList @('/a', $package, '/qn', "TARGETDIR=$expanded") `
            -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "MSI administrative extraction failed: $($process.ExitCode)" }

          $offline = Join-Path $env:RUNNER_TEMP 'offline'
          New-Item -ItemType Directory -Path $offline | Out-Null
          $archive = Join-Path $root 'candidate/objects/agentmemory-offline-bundle.tar.zst'
          $entries = & tar.exe --list --file $archive
          if ($LASTEXITCODE -ne 0 -or $entries.Count -eq 0) { throw 'Offline bundle listing failed' }
          foreach ($entry in $entries) {
            $segments = $entry -split '/'
            if ($entry.StartsWith('/') -or $entry.Contains('\') -or $segments -contains '..') {
              throw "Offline bundle contains unsafe path: $entry"
            }
          }
          & tar.exe --extract --file $archive --directory $offline
          if ($LASTEXITCODE -ne 0) { throw 'Offline bundle extraction failed' }
          $expected = Join-Path $env:RUNNER_TEMP 'expected-stage'
          $sourceEpoch = (Get-Content -LiteralPath (Join-Path $root 'publication.json') -Raw | ConvertFrom-Json).build_timestamp
          go run ./apps/launcher/cmd/agentmemory-native-package-stage `
            -root . `
            -bundle (Join-Path $offline 'bundle') `
            -trust (Join-Path $root 'candidate/release-trust.json') `
            -output $expected `
            -os windows `
            -arch amd64 `
            -source-date-epoch $sourceEpoch `
            -verification-epoch ([DateTimeOffset]::UtcNow.ToUnixTimeSeconds())
          if ($LASTEXITCODE -ne 0) { throw 'Expected Windows payload reconstruction failed' }

          $launcher = Get-ChildItem -LiteralPath $expanded -Filter agentmemory.exe -File -Recurse
          $helper = Get-ChildItem -LiteralPath $expanded -Filter agentmemory-runtime-helper.exe -File -Recurse
          if ($launcher.Count -ne 1 -or $helper.Count -ne 1) { throw 'MSI payload executable set is incomplete' }

          $expectedPayload = Join-Path $expected 'payload'
          $actualPayload = $launcher[0].Directory.FullName
          if (Get-ChildItem -LiteralPath $actualPayload -Recurse -Force -Attributes ReparsePoint | Select-Object -First 1) {
            throw 'MSI payload contains a reparse point'
          }
          $expectedFiles = @(Get-ChildItem -LiteralPath $expectedPayload -File -Recurse)
          $actualFiles = @(Get-ChildItem -LiteralPath $actualPayload -File -Recurse)
          if ($expectedFiles.Count -ne $actualFiles.Count) { throw 'MSI payload file set differs from verified stage' }
          foreach ($expectedFile in $expectedFiles) {
            $relative = [IO.Path]::GetRelativePath($expectedPayload, $expectedFile.FullName)
            $actualFile = Join-Path $actualPayload $relative
            if (-not (Test-Path -LiteralPath $actualFile -PathType Leaf) -or
              (Get-FileHash -LiteralPath $expectedFile.FullName -Algorithm SHA256).Hash -cne
              (Get-FileHash -LiteralPath $actualFile -Algorithm SHA256).Hash) {
              throw "MSI payload byte mismatch: $relative"
            }
          }

          Assert-ExactSignature $launcher[0].FullName
          Assert-ExactSignature $helper[0].FullName
          Assert-ExactSignature (Join-Path $root 'bootstrap/agentmemory-bootstrap-windows-amd64.exe')

  linux-packages:
    name: Native Linux package payloads
    needs: retained-bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact tagged source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install the pinned Go toolchain
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.26.5"
          check-latest: false
          cache: true
          cache-dependency-path: go.mod

      - name: Download exact release-build candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.build_artifact }}
          path: ${{ runner.temp }}/release-build
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.build_run_id }}

      - name: Rehash and inspect every Debian and RPM payload
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/release-build"
          go run ./apps/launcher/cmd/agentmemory-publication-record \
            -candidate-root "$root/candidate" \
            -verify-record "$root/publication.json"
          command -v rpm >/dev/null
          command -v cpio >/dev/null
          offline="$RUNNER_TEMP/offline"
          install -d -m 0700 "$offline"
          archive="$root/candidate/objects/agentmemory-offline-bundle.tar.zst"
          if tar --zstd --list --file "$archive" | \
            awk 'BEGIN { bad=0 } /^\// || /(^|\/)\.\.($|\/)/ || /\\/ { bad=1 } END { exit bad }'; then
            :
          else
            echo 'Offline bundle contains an unsafe path' >&2
            exit 1
          fi
          tar --zstd --extract --file "$archive" --directory "$offline" \
            --no-same-owner --no-same-permissions
          source_epoch=$(jq -r '.build_timestamp' "$root/publication.json")
          verification_epoch=$(date -u +%s)
          for arch in amd64 arm64; do
            deb="$root/candidate/objects/agentmemory-linux-$arch-deb.deb"
            rpm_package="$root/candidate/objects/agentmemory-linux-$arch-rpm.rpm"
            dpkg-deb --field "$deb" Package Version Architecture Depends
            dpkg-deb --contents "$deb" > "$RUNNER_TEMP/deb-$arch.txt"
            grep -Fq './usr/libexec/agentmemory/agentmemory' "$RUNNER_TEMP/deb-$arch.txt"
            grep -Fq './usr/libexec/agentmemory/agentmemory-runtime-helper' "$RUNNER_TEMP/deb-$arch.txt"
            rpm -qpl "$rpm_package" > "$RUNNER_TEMP/rpm-$arch.txt"
            grep -Fxq '/usr/libexec/agentmemory/agentmemory' "$RUNNER_TEMP/rpm-$arch.txt"
            grep -Fxq '/usr/libexec/agentmemory/agentmemory-runtime-helper' "$RUNNER_TEMP/rpm-$arch.txt"
            expected="$RUNNER_TEMP/expected-linux-$arch"
            go run ./apps/launcher/cmd/agentmemory-linux-release \
              -root . \
              -bundle "$offline/bundle" \
              -trust "$root/candidate/release-trust.json" \
              -output "$expected" \
              -arch "$arch" \
              -source-date-epoch "$source_epoch" \
              -verification-epoch "$verification_epoch"
            deb_root="$RUNNER_TEMP/deb-root-$arch"
            rpm_root="$RUNNER_TEMP/rpm-root-$arch"
            install -d -m 0700 "$deb_root" "$rpm_root"
            dpkg-deb --extract "$deb" "$deb_root"
            rpm2cpio "$rpm_package" | (cd "$rpm_root" && cpio -idm --quiet)
            expected_count=$((2 + $(find "$expected/bundle" -type f | wc -l)))
            for payload_root in "$deb_root" "$rpm_root"; do
              installed="$payload_root/usr/libexec/agentmemory"
              test -z "$(find "$installed" -type l -print -quit)"
              test "$(find "$installed" -type f | wc -l)" -eq "$expected_count"
              cmp "$expected/agentmemory" "$installed/agentmemory"
              cmp "$expected/agentmemory-runtime-helper" "$installed/agentmemory-runtime-helper"
              diff -qr "$expected/bundle" "$installed/resources/bundle"
            done
          done

  qualify:
    name: Attest and retain exact qualified candidate
    needs: [retained-bundle, macos-package, windows-package, linux-packages]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: pf001-release-qualification
    steps:
      - name: Check out exact tagged source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install the pinned Go toolchain
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.26.5"
          check-latest: false
          cache: true
          cache-dependency-path: go.mod

      - name: Download exact release-build candidate again
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.build_artifact }}
          path: ${{ runner.temp }}/qualified
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.build_run_id }}

      - name: Final byte-level re-verification
        run: |
          go run ./apps/launcher/cmd/agentmemory-publication-record \
            -candidate-root "$RUNNER_TEMP/qualified/candidate" \
            -verify-record "$RUNNER_TEMP/qualified/publication.json"

      - name: Attest every exact qualified object
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: ${{ runner.temp }}/qualified/**/*

      - name: Retain exact candidate for immutable promotion
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pf001-qualified-release-${{ github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/qualified
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          include-hidden-files: false
